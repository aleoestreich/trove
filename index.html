<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Declares built-in dark mode so Samsung Internet / Chrome don't force-darken the page -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b1f" media="(prefers-color-scheme: dark)" />
    <!-- use-credentials: the manifest is behind the login, so the request must carry the session cookie -->
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Trove</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
